<!-- @dsCard group="Inputs" height=640 subtitle="Say or type it, with mic" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <div class="field">
    <label class="field-label" for="say1">Say or type it</label>
    <div class="field-wrap">
      <input class="field-input" id="say1" type="text" placeholder="Four 14-inch pizzas for Saturday dinner" autocomplete="off">
      <button class="mic" type="button" aria-label="Speak your request" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <span class="field-hint">Default</span>
  </div>

  <div class="field">
    <label class="field-label" for="say2">Say or type it</label>
    <div class="field-wrap">
      <input class="field-input" id="say2" type="text" value="four 14 inch pizzas for" autocomplete="off">
      <button class="mic" type="button" aria-label="Stop listening" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <span class="field-status" role="status">Listening&hellip; tap the mic to stop.</span>
  </div>

  <div class="field">
    <label class="field-label" for="say3">Say or type it</label>
    <div class="field-wrap is-focus">
      <input class="field-input" id="say3" type="text" value="four 14 inch pizzas for saturday dinner" autocomplete="off">
      <button class="mic" type="button" aria-label="Speak your request" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <span class="field-status" role="status">Got it. Check the choices below, then tap Make my plan.</span>
    <div class="tags" aria-label="What we heard">
      <span class="tag">4 pizzas</span><span class="tag">14"</span><span class="tag">Sat</span><span class="tag">Dinner</span>
    </div>
  </div>

  <div class="field">
    <label class="field-label" for="say4">Say or type it</label>
    <div class="field-wrap">
      <input class="field-input" id="say4" type="text" placeholder="Four 14-inch pizzas for Saturday dinner" autocomplete="off">
    </div>
    <span class="field-hint">No mic on this device? Use the microphone on your keyboard to dictate.</span>
  </div>
</div>
