<!-- @dsCard group="Actions" height=430 subtitle="Primary, secondary and every state" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <div class="stack">
    <span class="state-label">Primary, default</span>
    <button class="btn btn-primary btn-block" type="button">Make my plan</button>
  </div>
  <div class="stack">
    <span class="state-label">Primary, pressed (sinks 3px)</span>
    <button class="btn btn-primary btn-block is-pressed" type="button">Make my plan</button>
  </div>
  <div class="stack">
    <span class="state-label">Secondary, default and pressed</span>
    <div class="row">
      <button class="btn btn-secondary" type="button">Back</button>
      <button class="btn btn-secondary is-pressed" type="button">Back</button>
    </div>
  </div>
  <div class="stack">
    <span class="state-label">Disabled (dashed edge, no shadow) and keyboard focus</span>
    <div class="row">
      <button class="btn btn-primary" type="button" disabled>Start timer</button>
      <button class="btn btn-secondary is-focus" type="button">Add to calendar</button>
    </div>
  </div>
</div>
