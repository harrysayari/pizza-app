<!-- @dsCard group="Inputs" height=360 subtitle="Keep screen on" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <label class="toggle">
    <input type="checkbox" role="switch" checked>
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span class="toggle-text"><span class="label">Keep screen on</span><span class="toggle-state"><span class="on">On</span><span class="off">Off</span></span></span>
  </label>
  <label class="toggle">
    <input type="checkbox" role="switch">
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span class="toggle-text"><span class="label">Keep screen on</span><span class="toggle-state"><span class="on">On</span><span class="off">Off</span></span></span>
  </label>
  <label class="toggle">
    <input type="checkbox" role="switch" disabled>
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span class="toggle-text"><span class="label">Keep screen on</span><span class="toggle-state">Not available in this browser</span></span>
  </label>
  <div class="stack">
    <span class="state-label">Keyboard focus</span>
    <div class="toggle"><span class="toggle-track is-on is-focus"><span class="toggle-thumb"></span></span><span class="toggle-text"><span class="label">Keep screen on</span><span class="toggle-state">On</span></span></div>
  </div>
</div>
