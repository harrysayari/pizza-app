<!-- @dsCard group="Feedback" height=420 subtitle="Too-soon heads-up and success note" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <div class="banner" role="status">
    <svg class="banner-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div class="banner-body">
      <p class="banner-title">Not enough time for Saturday 7:30 pm</p>
      <p>This dough needs about 22 hours. The earliest it can be ready is Sunday 6:00 pm.</p>
      <button class="btn btn-primary" type="button">Use Sunday 6:00 pm</button>
    </div>
  </div>

  <div class="banner banner-ok" role="status">
    <svg class="banner-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
    <div class="banner-body">
      <p class="banner-title">Added to your calendar</p>
      <p>You will get a reminder for every step.</p>
    </div>
  </div>
</div>
