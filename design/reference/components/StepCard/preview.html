<!-- @dsCard group="Step mode" height=560 subtitle="One step per screen" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <article class="step" aria-labelledby="st-title">
    <div class="step-meta">
      <span class="step-count">Step 4 of 13</span>
      <span class="dough-dots" aria-hidden="true">
        <span class="dot is-done"></span><span class="dot is-done"></span><span class="dot is-done"></span><span class="dot is-now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </span>
    </div>
    <h2 class="step-title" id="st-title">Add the salt water slowly</h2>
    <ul class="step-amounts" aria-label="Amounts for this step">
      <li>302 g <span class="unit-name">water</span></li>
      <li>20 g <span class="unit-name">salt</span></li>
    </ul>
    <p class="step-text">Pour the salt water into the bowl in three parts, not all at once. Mix slowly after each part until it is taken up.</p>
    <div class="step-actions">
      <button class="btn btn-secondary" type="button">Back</button>
      <button class="btn btn-primary" type="button">Done, next step</button>
    </div>
  </article>
</div>
