<!-- @dsCard group="Schedule" height=720 subtitle="Plan summary and ingredient list in grams" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<div class="stage">
  <div class="summary" role="group" aria-label="Plan summary">
    <div class="summary-item"><span class="summary-label">Pizzas</span><span class="amount">4 &times; 14"</span></div>
    <div class="summary-item"><span class="summary-label">Each ball</span><span class="amount">310 g</span></div>
    <div class="summary-item"><span class="summary-label">Total dough</span><span class="amount">1,240 g</span></div>
  </div>

  <div class="stack">
    <h3 class="h3">Poolish</h3>
    <ul class="ing-list">
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">Water</span><span class="ing-amount">202 g</span></label></li>
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">00 flour</span><span class="ing-amount">202 g</span></label></li>
      <li><label class="ing"><input type="checkbox" checked><span class="ing-box"></span><span class="ing-name">Yeast</span><span class="ing-amount">5 g</span></label></li>
      <li><label class="ing"><input type="checkbox" checked><span class="ing-box"></span><span class="ing-name">Honey</span><span class="ing-amount">5 g</span></label></li>
    </ul>
  </div>

  <div class="stack">
    <h3 class="h3">Final dough</h3>
    <ul class="ing-list">
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">Manitoba (bread) flour</span><span class="ing-amount">302 g</span></label></li>
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">00 flour<span class="ing-note">or all-purpose</span></span><span class="ing-amount">202 g</span></label></li>
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">Water<span class="ing-note">in a separate container</span></span><span class="ing-amount">302 g</span></label></li>
      <li><label class="ing"><input type="checkbox"><span class="ing-box"></span><span class="ing-name">Salt<span class="ing-note">dissolve in the water</span></span><span class="ing-amount">20 g</span></label></li>
    </ul>
  </div>
</div>
